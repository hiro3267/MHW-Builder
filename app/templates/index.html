<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>{{ titulo }}</title>
    <script
     src="https://unpkg.com/htmx.org@2.0.3">
    </script>

    <script>
    function abrirModalArma() {
        htmx.ajax('GET', '/armas/modal', {
            target: '#modal-container',
            swap: 'innerHTML'
        });
    }

    function abrirModalKinsect() {
        htmx.ajax("GET", "/kinsect-modal", {
            target: "#kinsect-modal-container",
            swap: "innerHTML"
        });
    }

    function abrirModalArmadura(campo) {
        htmx.ajax('GET', `/armaduras/modal?campo=${encodeURIComponent(campo)}`, {
            target: '#modal-container',
            swap: 'innerHTML'
        });
    }
    
    function selecionarArma(id, nome, detalhesHtml, imagem = "", tipo = "") {
        const input = document.getElementById("arma_id_input");
        const nomeElemento = document.getElementById("arma-selecionada-nome");
        const detalhesElemento = document.getElementById("arma-selecionada-detalhes");
        const imagemElemento = document.getElementById("arma-selecionada-imagem");
        const placeholder = document.getElementById("arma-placeholder");

        if (!input || !nomeElemento || !detalhesElemento || !imagemElemento) {
            console.error("Não encontrei os campos da arma selecionada.");
            return;
        }

        input.value = id;
        nomeElemento.textContent = nome;

        detalhesElemento.innerHTML = detalhesHtml || "";
        detalhesElemento.hidden = !detalhesHtml;

        imagemElemento.onerror = () => {
            imagemElemento.onerror = null;
            imagemElemento.hidden = true;
            imagemElemento.removeAttribute("src");

            if (placeholder) {
                placeholder.hidden = false;
            }
        };

        if (imagem) {
            imagemElemento.src = imagem;
            imagemElemento.hidden = false;

            if (placeholder) {
                placeholder.hidden = true;
            }
        } else {
            imagemElemento.hidden = true;
            imagemElemento.removeAttribute("src");

            if (placeholder) {
                placeholder.hidden = false;
            }
        }

        input.dispatchEvent(new Event("change", { bubbles: true }));

        document.getElementById("modal-container").innerHTML = "";

        // Atualiza o seletor de kinsect conforme a arma escolhida.
        const kinsectContainer = document.getElementById("kinsect-container");

        if (kinsectContainer) {
            if (tipo === "glaive_insetos") {
                htmx.ajax(
                    "GET",
                    `/kinsect-select?arma_id=${encodeURIComponent(id)}`,
                    {
                        target: "#kinsect-container",
                        swap: "innerHTML"
                    }
                );
            } else {
                // Remove o seletor e qualquer kinsect selecionado anteriormente.
                kinsectContainer.innerHTML = "";

                kinsectContainer.innerHTML = "";

                const kinsectInput = document.getElementById("kinsect_id_input");

                if (kinsectInput) {
                    kinsectInput.value = "";
                }
            }
        }
    }

    function selecionarKinsect(id, nome) {
        const input = document.getElementById("kinsect_id_input");
        const nomeElemento = document.getElementById("kinsect-selecionado-nome");
        const modal = document.getElementById("kinsect-modal-container");

        if (!input || !nomeElemento) return;

        input.value = id;
        nomeElemento.textContent = nome;

        if (modal) {
            modal.innerHTML = "";
        }
    }

    function selecionarArmadura(
        id,
        nome,
        campo,
        detalhesHtml,
        imagemMale = "",
        imagemFemale = ""
    ) {
        const input = document.getElementById(`${campo}_id_select`);
        const nomeElemento = document.getElementById(
            `${campo}-selecionada-nome`
        );
        const detalhesElemento = document.getElementById(
            `${campo}-selecionada-detalhes`
        );
        const imagemElemento = document.getElementById(
            `${campo}-selecionada-imagem`
        );

        if (!input || !nomeElemento || !detalhesElemento) {
            console.error(
                `Elementos da armadura não encontrados para: ${campo}`
            );
            return;
        }

        input.value = id;
        nomeElemento.textContent = nome;
        detalhesElemento.innerHTML = detalhesHtml || "";
        detalhesElemento.hidden = !detalhesHtml;

        // Guarda as duas imagens para que a escolha Male/Female
        // também atualize a peça depois de selecionada.
        if (imagemElemento) {
            imagemElemento.dataset.imageMale = imagemMale || "";
            imagemElemento.dataset.imageFemale = imagemFemale || "";
            atualizarImagemSelecionada(imagemElemento);
        }
        input.dispatchEvent(new Event("change", { bubbles: true }));

        htmx.ajax("GET", `/decoracoes-select/${campo}/${id}`, {
            target: `#${campo}-decoracoes-container`,
            swap: "innerHTML"
        });

        document.getElementById("modal-container").innerHTML = "";
    }

    function abrirModalTalisma() {
        htmx.ajax('GET', '/talismas', {
            target: '#modal-container',
            swap: 'innerHTML'
        });
    }

    function selecionarTalisma(id, nome) {
        const input = document.getElementById('talisma_id_select');
        const nomeElemento = document.getElementById('talisma-selecionada-nome');

        if (!input || !nomeElemento) {
            console.error('Não encontrei o campo ou o nome do talismã.');
            return;
        }

        input.value = id;
        nomeElemento.textContent = nome;
        document.getElementById("talisma-placeholder")?.classList.add("equipamento-placeholder-selecionado");

        input.dispatchEvent(new Event('change', { bubbles: true }));

        document.getElementById('modal-container').innerHTML = '';
    }

    let tipoArmaSelecionado = null;

    function mostrarArmas(tipo) {
        tipoArmaSelecionado = tipo;

        document.getElementById('filtros-elementos').hidden = false;

        filtrarElemento('todos');
    }

    function filtrarElemento(elemento) {
        if (!tipoArmaSelecionado) return;

        const url = `/armas/modal/lista?tipo=${encodeURIComponent(tipoArmaSelecionado)}&elemento=${encodeURIComponent(elemento)}`;

        htmx.ajax('GET', url, {
            target: '#lista-armas-filtradas',
            swap: 'innerHTML'
        });
    }

    function filtrarArmadurasModal() {
        const busca = document
            .getElementById("busca-armadura")
            .value.toLocaleLowerCase("pt-BR");

        const rank = document.getElementById("filtro-rank-armadura").value;
        const raridade = document.getElementById("filtro-raridade-armadura").value;

        document.querySelectorAll("#lista-armaduras-modal li[data-id]")
            .forEach(item => {
                const nome = item.dataset.nome.toLocaleLowerCase("pt-BR");

                const nomeValido = nome.includes(busca);
                const rankValido = rank === "todos" || item.dataset.rank === rank;
                const raridadeValida =
                    raridade === "todas" || item.dataset.raridade === raridade;

                item.hidden = !(nomeValido && rankValido && raridadeValida);
            });
    }

    function ordenarArmadurasModal() {
        const lista = document.getElementById("lista-armaduras-modal");
        if (!lista) return;

        const ordem = document.getElementById("ordem-armadura").value;
        const itens = [...lista.querySelectorAll("li[data-id]")];

        itens.sort((a, b) => {
            if (ordem === "raridade-desc") {
                return Number(b.dataset.raridade) - Number(a.dataset.raridade);
            }
            if (ordem === "raridade-asc") {
                return Number(a.dataset.raridade) - Number(b.dataset.raridade);
            }
            if (ordem === "defesa-desc") {
                return Number(b.dataset.defesa) - Number(a.dataset.defesa);
            }
            if (ordem === "defesa-asc") {
                return Number(a.dataset.defesa) - Number(b.dataset.defesa);
            }

            return a.dataset.nome.localeCompare(b.dataset.nome, "pt-BR");
        });

        itens.forEach(item => lista.appendChild(item));
    }

    function filtrarArmasModal() {
        const busca = document
            .getElementById("busca-arma")
            .value.toLocaleLowerCase("pt-BR");

        const raridade = document.getElementById("filtro-raridade-arma").value;

        document.querySelectorAll("#lista-armas-modal li[data-id]")
            .forEach(item => {
                const nome = item.dataset.nome.toLocaleLowerCase("pt-BR");

                const nomeValido = nome.includes(busca);
                const raridadeValida =
                    raridade === "todas" || item.dataset.raridade === raridade;

                item.hidden = !(nomeValido && raridadeValida);
            });
    }

    function ordenarArmasModal() {
        const lista = document.getElementById("lista-armas-modal");
        if (!lista) return;

        const ordem = document.getElementById("ordem-arma").value;
        const itens = [...lista.querySelectorAll("li[data-id]")];

        itens.sort((a, b) => {
            if (ordem === "raridade-desc") {
                return Number(b.dataset.raridade) - Number(a.dataset.raridade);
            }
            if (ordem === "ataque-desc") {
                return Number(b.dataset.ataque) - Number(a.dataset.ataque);
            }
            if (ordem === "afinidade-desc") {
                return Number(b.dataset.afinidade) - Number(a.dataset.afinidade);
            }

            return a.dataset.nome.localeCompare(b.dataset.nome, "pt-BR");
        });

        itens.forEach(item => lista.appendChild(item));
    }

    function inicializarFiltrosTalismas() {
        const lista = document.getElementById("lista-talismas-modal");

        if (!lista) return;

        const itens = [...lista.querySelectorAll("li[data-id]")];

        const filtroRaridade = document.getElementById("filtro-raridade-talisma");
        const filtroNivel = document.getElementById("filtro-nivel-talisma");

        const raridades = [...new Set(
            itens.map(item => item.dataset.raridade)
        )].sort((a, b) => Number(a) - Number(b));

        const niveis = [...new Set(
            itens.map(item => item.dataset.nivel)
        )].sort((a, b) => Number(a) - Number(b));

        raridades.forEach(raridade => {
            filtroRaridade.add(
                new Option(`Raridade ${raridade}`, raridade)
            );
        });

        niveis.forEach(nivel => {
            filtroNivel.add(
                new Option(`Nível ${nivel}`, nivel)
            );
        });
    }


    function filtrarTalismasModal() {
        const busca = document
            .getElementById("busca-talisma")
            .value.toLocaleLowerCase("pt-BR");

        const buscaSkill = document
            .getElementById("busca-skill-talisma")
            .value.toLocaleLowerCase("pt-BR");

        const raridade = document.getElementById("filtro-raridade-talisma").value;
        const nivel = document.getElementById("filtro-nivel-talisma").value;

        const itens = document.querySelectorAll(
            "#lista-talismas-modal li[data-id]"
        );

        itens.forEach(item => {
            const nome = item.dataset.nome.toLocaleLowerCase("pt-BR");
            const skills = item.dataset.skills.toLocaleLowerCase("pt-BR");

            const correspondeNome = nome.includes(busca);
            const correspondeSkill = skills.includes(buscaSkill);

            const correspondeRaridade =
                raridade === "todos" || item.dataset.raridade === raridade;

            const correspondeNivel =
                nivel === "todos" || item.dataset.nivel === nivel;

            item.hidden = !(
                correspondeNome &&
                correspondeSkill &&
                correspondeRaridade &&
                correspondeNivel
            );
        });
    }


    function ordenarTalismasModal() {
        const lista = document.getElementById("lista-talismas-modal");

        if (!lista) return;

        const ordem = document.getElementById("ordem-talisma").value;

        const itens = [...lista.querySelectorAll("li[data-id]")];

        itens.sort((a, b) => {
            switch (ordem) {
                case "raridade-desc":
                    return Number(b.dataset.raridade) - Number(a.dataset.raridade);

                case "raridade-asc":
                    return Number(a.dataset.raridade) - Number(b.dataset.raridade);

                case "nivel-desc":
                    return Number(b.dataset.nivel) - Number(a.dataset.nivel);

                case "nivel-asc":
                    return Number(a.dataset.nivel) - Number(b.dataset.nivel);

                default:
                    return a.dataset.nome.localeCompare(b.dataset.nome);
            }
        });

        itens.forEach(item => lista.appendChild(item));
    }

    let sexoArmaduraSelecionado = "male";

    function alterarSexoArmadura(sexo) {
        sexoArmaduraSelecionado = sexo;

        document.querySelectorAll(".armadura-imagem img").forEach(img => {
            atualizarImagemSelecionada(img);
        });

        document.querySelectorAll('input[name="sexo-armadura"]').forEach(input => {
            input.checked = input.value === sexo;
        });

        document.querySelectorAll(".imagem-armadura-selecionada")
            .forEach(atualizarImagemSelecionada);
    }

    function atualizarModalArmaduras() {
        alterarSexoArmadura(sexoArmaduraSelecionado);
    }
    
    document.body.addEventListener("htmx:afterSwap", function (event) {
        if (event.target.id === "lista-armas-filtradas") {
            filtrarArmasModal();
            ordenarArmasModal();
        }

        if (event.target.id === "modal-container") {
            atualizarModalArmaduras();
            inicializarFiltrosTalismas();
        }
    });

    function atualizarImagemSelecionada(img) {
        const placeholder = document.getElementById(img.id.replace("-selecionada-imagem", "-placeholder"));
        const principal = sexoArmaduraSelecionado === "female"
            ? img.dataset.imageFemale
            : img.dataset.imageMale;

        const alternativa = sexoArmaduraSelecionado === "female"
            ? img.dataset.imageMale
            : img.dataset.imageFemale;

        // Cada tentativa é feita no máximo uma vez. Isso trata URLs
        // quebradas, mas não consegue detectar imagens que carregam em branco.
        const tentarImagem = (url, urlAlternativa) => {
            if (!url) {
                if (urlAlternativa) {
                    tentarImagem(urlAlternativa, "");
                } else {
                    img.hidden = true;
                    img.removeAttribute("src");
                    if (placeholder) placeholder.hidden = false;
                }
                return;
            }

            img.onerror = () => {
                img.onerror = null;

                if (urlAlternativa && urlAlternativa !== url) {
                    tentarImagem(urlAlternativa, "");
                } else {
                    img.hidden = true;
                    img.removeAttribute("src");
                    if (placeholder) placeholder.hidden = false;
                }
            };

            img.hidden = false;
            if (placeholder) placeholder.hidden = true;
            img.src = url;
        };

        tentarImagem(principal, alternativa);
    }

    function esperarEventoHTMX(elemento, nomeEvento, timeout = 8000) {
        return new Promise((resolve, reject) => {
            let temporizador;

            const aoOcorrer = (evento) => {
                clearTimeout(temporizador);
                elemento.removeEventListener(nomeEvento, aoOcorrer);
                resolve(evento);
            };

            elemento.addEventListener(nomeEvento, aoOcorrer, { once: true });
            temporizador = setTimeout(() => {
                elemento.removeEventListener(nomeEvento, aoOcorrer);
                reject(new Error(`Tempo esgotado aguardando ${nomeEvento}.`));
            }, timeout);
        });
    }

    async function alternarMinhasBuilds() {
        const conteudo = document.getElementById("minhas-builds-conteudo");
        const botao = document.getElementById("botao-minhas-builds");

        // Se a lista já foi carregada, apenas recolhe ou expande.
        if (conteudo.dataset.carregada === "true") {
            conteudo.hidden = !conteudo.hidden;
            botao.textContent = conteudo.hidden
                ? "Ver minhas builds"
                : "Recolher minhas builds";
            return;
        }

        try {
            const resposta = await fetch("/minhas-builds");

            if (!resposta.ok) {
                throw new Error("Não foi possível carregar as builds.");
            }

            conteudo.innerHTML = await resposta.text();
            htmx.process(conteudo);

            conteudo.dataset.carregada = "true";
            conteudo.hidden = false;
            botao.textContent = "Recolher minhas builds";
        } catch (erro) {
            console.error(erro);
            conteudo.innerHTML = "<p>Erro ao carregar suas builds.</p>";
        }
    }

    async function buscarEquipamentoSalvo(tipo, id) {
        if (!id) return null;

        const resposta = await fetch(
            `/minhas-builds/equipamentos/${encodeURIComponent(tipo)}/${encodeURIComponent(id)}`
        );

        if (!resposta.ok) {
            throw new Error(`Não foi possível recuperar o equipamento ${id}.`);
        }
        return await resposta.json();
    }

    function valorCampo(objeto, caminhos, padrao = "") {
        for (const caminho of caminhos) {
            let valor = objeto;
            for (const parte of caminho.split(".")) {
                valor = valor?.[parte];
            }
            if (valor !== undefined && valor !== null && valor !== "") return valor;
        }
        return padrao;
    }

    function escaparHTML(valor) {
        return String(valor ?? "").replace(/[&<>"']/g, caractere => ({
            "&": "&amp;",
            "<": "&lt;",
            ">": "&gt;",
            '"': "&quot;",
            "'": "&#39;"
        })[caractere]);
    }

    function montarDetalhesArma(arma) {
        const elementos = (arma.elementos || [])
            .filter(elemento => !elemento.oculto);

        const slots = arma.slots || [];

        return `
            <div class="armadura-info">
                <strong>${escaparHTML(arma.nome)}</strong>
                <span class="armadura-raridade">
                    Raridade ${escaparHTML(arma.raridade)}
                </span>
            </div>

            <div class="armadura-atributos">
                <span>⚔️ Ataque: ${escaparHTML(arma.ataque_display)}</span>
                <span>🎯 Afinidade: ${escaparHTML(arma.afinidade)}%</span>
                ${arma.defesa_bonus
                    ? `<span>🛡️ Defesa: +${escaparHTML(arma.defesa_bonus)}</span>`
                    : ""}
            </div>

            <div class="armadura-skills">
                <strong>Elementos e efeitos:</strong>
                ${elementos.length
                    ? elementos.map(elemento =>
                        `<span>${escaparHTML(elemento.tipo)}: ${escaparHTML(elemento.valor)}</span>`
                    ).join(" ")
                    : "<span>Sem elemento listado</span>"
                }
            </div>

            <div class="armadura-slots">
                <strong>Slots:</strong>
                ${slots.length
                    ? slots.map(slot =>
                        `<span class="slot-nivel">Nível ${escaparHTML(slot)}</span>`
                    ).join("")
                    : "<span>Sem slots para decorações</span>"
                }
            </div>

            ${arma.tipo_disparo
                ? `<div class="armadura-skills">
                    Disparo: ${escaparHTML(arma.tipo_disparo)}
                    ${arma.nivel_disparo
                        ? ` — Nível ${escaparHTML(arma.nivel_disparo)}`
                        : ""}
                </div>`
                : ""
            }

            ${arma.tipo_frasco
                ? `<div class="armadura-skills">
                    Tipo de frasco: ${escaparHTML(arma.tipo_frasco)}
                    ${arma.nivel_frasco
                        ? ` — Nível ${escaparHTML(arma.nivel_frasco)}`
                        : ""}
                </div>`
                : ""
            }
        `;
    }
    
    function atualizarNomeDetalhes(campo, item, tipo) {
        const prefixo = campo === "arma" ? "arma" : campo;
        const nomeEl = document.getElementById(`${prefixo}-selecionada-nome`);
        const detalhesEl = document.getElementById(`${prefixo}-selecionada-detalhes`);
        const placeholder = document.getElementById(`${prefixo}-placeholder`);

        if (!item) {
            if (nomeEl) {
                nomeEl.textContent = campo === "arma"
                    ? "Selecione uma arma"
                    : campo === "talisma"
                    ? "Selecione um talismã"
                    : "Selecione uma peça de armadura";
            }

            if (detalhesEl) {
                detalhesEl.innerHTML = "";
                detalhesEl.hidden = true;
            }

            if (placeholder) {
                placeholder.hidden = false;
                placeholder.classList.remove("equipamento-placeholder-selecionado");
            }

            const imagemEl = document.getElementById(`${prefixo}-selecionada-imagem`);

            if (imagemEl) {
                imagemEl.hidden = true;
                imagemEl.removeAttribute("src");
                imagemEl.onerror = null;
                imagemEl.dataset.imageMale = "";
                imagemEl.dataset.imageFemale = "";
            }

            return;
        }

        if (nomeEl) {
            nomeEl.textContent = item.nome || "Equipamento selecionado";
        }

        if (placeholder) {
            placeholder.classList.add("equipamento-placeholder-selecionado");
        }

        if (tipo === "arma") {
            if (detalhesEl) {
                detalhesEl.innerHTML = montarDetalhesArma(item);
                detalhesEl.hidden = false;
            }

            const img = document.getElementById("arma-selecionada-imagem");

            if (img) {
                const url = valorCampo(item, [
                    "image",
                    "assets.image",
                    "imagem"
                ]);

                img.onerror = () => {
                    img.onerror = null;
                    img.hidden = true;
                    img.removeAttribute("src");

                    if (placeholder) placeholder.hidden = false;
                };

                if (url) {
                    img.src = url;
                    img.hidden = false;

                    if (placeholder) placeholder.hidden = true;
                } else {
                    img.hidden = true;
                    img.removeAttribute("src");

                    if (placeholder) placeholder.hidden = false;
                }
            }
        }

        if (tipo === "armadura") {
            const img = document.getElementById(`${campo}-selecionada-imagem`);

            if (img) {
                img.dataset.imageMale = valorCampo(item, [
                    "assets.imageMale",
                    "imageMale",
                    "imagem_masculina"
                ]);

                img.dataset.imageFemale = valorCampo(item, [
                    "assets.imageFemale",
                    "imageFemale",
                    "imagem_feminina"
                ]);

                atualizarImagemSelecionada(img);
            }

            // Os detalhes das armaduras ainda serão montados
            // com base nos campos do objeto de armadura.
            if (detalhesEl) {
                detalhesEl.innerHTML = "";
                detalhesEl.hidden = true;
            }
        }

        if (tipo === "talisma") {
            const imagemEl = document.getElementById("talisma-selecionada-imagem");

            if (detalhesEl) {
                detalhesEl.innerHTML = "";
                detalhesEl.hidden = true;
            }
        }
    }

    async function carregarDecoracoesSalvas(campo, equipamentoId, decoracoesSalvas) {
        const container = document.getElementById(`${campo}-decoracoes-container`);
        if (!container) return;

        if (!equipamentoId) {
            container.innerHTML = "";
            return;
        }

        const evento = esperarEventoHTMX(container, "htmx:afterSettle");
        htmx.ajax("GET", `/decoracoes-select/${encodeURIComponent(campo)}/${encodeURIComponent(equipamentoId)}`, {
            target: `#${campo}-decoracoes-container`,
            swap: "innerHTML"
        });

        try {
            await evento;
        } catch (erro) {
            console.warn(`Não foi possível carregar as decorações de ${campo}.`, erro);
            return;
        }

        // O template de decorações atualmente inclui um wrapper com o mesmo ID
        // do container. Procura seletores tanto no próprio container quanto nos filhos.
        const seletores = [
            ...container.querySelectorAll('select[name$="_decoracoes"]')
        ];
        seletores.forEach((select, indice) => {
            select.value = decoracoesSalvas?.[indice] ?? "";
            select.dispatchEvent(new Event("change", { bubbles: true }));
        });
    }

    async function carregarKinsectSalvo(armaId, kinsectId) {
        const container = document.getElementById("kinsect-container");

        if (!container) return;

        const evento = esperarEventoHTMX(container, "htmx:afterSettle");

        htmx.ajax(
            "GET",
            `/kinsect-select?arma_id=${encodeURIComponent(armaId || "")}`,
            {
                target: "#kinsect-container",
                swap: "innerHTML"
            }
        );

        try {
            await evento;
        } catch (erro) {
            console.warn("Não foi possível carregar o seletor de kinsect.", erro);
            return;
        }

        const campoId = document.getElementById("kinsect_id_input");
        const nome = document.getElementById("kinsect-selecionado-nome");

        if (!campoId || !kinsectId) return;

        const kinsect = await buscarEquipamentoSalvo("kinsect", kinsectId);

        campoId.value = kinsect.id;

        if (nome) {
            nome.textContent = kinsect.nome;
        }
    }

    async function carregarBuildSalva(buildId) {
        try {
            const resposta = await fetch(`/minhas-builds/api/${encodeURIComponent(buildId)}`);
            if (!resposta.ok) throw new Error("Não foi possível carregar a build salva.");

            const resultado = await resposta.json();
            const build = resultado.dados;

            const ids = {
                arma: build.arma_id,
                cabeca: build.cabeca_id,
                peito: build.peito_id,
                bracos: build.bracos_id,
                cintura: build.cintura_id,
                pernas: build.pernas_id,
                talisma: build.talisma_id
            };

            const decoracoes = {
                arma: build.arma_decoracoes || [],
                cabeca: build.cabeca_decoracoes || [],
                peito: build.peito_decoracoes || [],
                bracos: build.bracos_decoracoes || [],
                cintura: build.cintura_decoracoes || [],
                pernas: build.pernas_decoracoes || []
            };

            // Primeiro recupera os dados dos equipamentos, para atualizar nomes e imagens.
            const [arma, cabeca, peito, bracos, cintura, pernas, talisma] =
                await Promise.all([
                    buscarEquipamentoSalvo("arma", ids.arma),
                    buscarEquipamentoSalvo("armadura", ids.cabeca),
                    buscarEquipamentoSalvo("armadura", ids.peito),
                    buscarEquipamentoSalvo("armadura", ids.bracos),
                    buscarEquipamentoSalvo("armadura", ids.cintura),
                    buscarEquipamentoSalvo("armadura", ids.pernas),
                    buscarEquipamentoSalvo("talisma", ids.talisma)
                ]);

            const camposIds = {
                arma_id_input: ids.arma,
                cabeca_id_select: ids.cabeca,
                peito_id_select: ids.peito,
                bracos_id_select: ids.bracos,
                cintura_id_select: ids.cintura,
                pernas_id_select: ids.pernas,
                talisma_id_select: ids.talisma
            };

            for (const [id, valor] of Object.entries(camposIds)) {
                const elemento = document.getElementById(id);
                if (elemento) elemento.value = valor ?? "";
            }

            atualizarNomeDetalhes("arma", arma, "arma");
            atualizarNomeDetalhes("cabeca", cabeca, "armadura");
            atualizarNomeDetalhes("peito", peito, "armadura");
            atualizarNomeDetalhes("bracos", bracos, "armadura");
            atualizarNomeDetalhes("cintura", cintura, "armadura");
            atualizarNomeDetalhes("pernas", pernas, "armadura");
            atualizarNomeDetalhes("talisma", talisma, "talisma");

            // Aguarda cada grupo de slots antes de definir as decorações salvas.
            await Promise.all([
                carregarDecoracoesSalvas("arma", ids.arma, decoracoes.arma),
                carregarDecoracoesSalvas("cabeca", ids.cabeca, decoracoes.cabeca),
                carregarDecoracoesSalvas("peito", ids.peito, decoracoes.peito),
                carregarDecoracoesSalvas("bracos", ids.bracos, decoracoes.bracos),
                carregarDecoracoesSalvas("cintura", ids.cintura, decoracoes.cintura),
                carregarDecoracoesSalvas("pernas", ids.pernas, decoracoes.pernas)
            ]);

            await carregarKinsectSalvo(ids.arma, build.kinsect_id);

            const formulario = document.getElementById("build-form");
            if (formulario) htmx.trigger(formulario, "change");

            console.log(`Build "${resultado.nome}" carregada.`);
        } catch (erro) {
            console.error(erro);
            alert(
                "Não foi possível carregar a build salva. Verifique se a rota " +
                "/minhas-builds/equipamentos/{tipo}/{item_id} está implementada."
            );
        }
    }
