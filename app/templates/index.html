<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>{{ titulo }}</title>
    <script src="https://unpkg.com/htmx.org@2.0.3"></script>
</head>
<body>
    <h1>{{ titulo }}</h1>
    <p>Bem-vindo ao MHW Build Planner! Em breve você poderá criar e compartilhar suas builds de Monster Hunter World.</p>

    <button hx-get="ping" hx-target="#resultado">
        Testar HTMX
    </button>
    <div id="resultado"></div>

    <hr>

    <button hx-get="/armas" hx-target="#lista-armas">
        Listar Armas
    </button>
    <div id="lista-armas"></div>

    <hr>

    <button hx-get="/armaduras" hx-target="#lista-armaduras">
        Listar Armaduras
    </button>
    <div id="lista-armaduras"></div>

    <hr>

    <button hx-get="/decoracoes" hx-target="#lista-decoracoes">
        Listar Decorações
    </button>
    <div id="lista-decoracoes"></div>

    <hr>

    <button hx-get="/talismas" hx-target="#lista-talismas">
        Listar Talismãs
    </button>
    <div id="lista-talismas"></div>

    <hr>

    <button hx-get="/kinsects" hx-target="#lista-kinsects">
        Listar Kinsects (teste — depois vira condicional à Glaive de Insetos)
    </button>
    <div id="lista-kinsects"></div>

    <hr>

    <form
        id="build-form"
        hx-post="/build"
        hx-target="#build-resultado"
        hx-trigger="change"
    >

        <div>
            <label>Arma:</label>
            <button type="button"
                hx-get="/arma-modal"
                hx-target="#modal-container"
                hx-swap="innerHTML">
                <span id="arma-selecionada-nome">Selecionar arma...</span>
            </button>
            <input type="hidden"
                name="arma_id"
                id="arma_id_input"
                hx-get="/kinsect-select"
                hx-trigger="change"
                hx-target="#kinsect-container"
                hx-include="this">
        </div>

        <div id="modal-container"></div>

        <div id="kinsect-container"></div>

        <div id="arma-decoracoes-container"></div>


        <label>
            Cabeça:
            <select name="cabeca_id" id="cabeca_id_select">
                <option value="">—</option>
                {% for peca in cabecas %}
                <option value="{{ peca.id }}">{{ peca.nome }}</option>
                {% endfor %}
            </select>
        </label>
        <div id="cabeca-decoracoes-container"></div>

        <label>
            Peito:
            <select name="peito_id" id="peito_id_select">
                <option value="">—</option>
                {% for peca in peitos %}
                <option value="{{ peca.id }}">{{ peca.nome }}</option>
                {% endfor %}
            </select>
        </label>
        <div id="peito-decoracoes-container"></div>


        <label>
            Braços:
            <select name="bracos_id" id="bracos_id_select">
                <option value="">—</option>
                {% for peca in bracos %}
                <option value="{{ peca.id }}">{{ peca.nome }}</option>
                {% endfor %}
            </select>
        </label>
        <div id="bracos-decoracoes-container"></div>

        <label>
            Cintura:
            <select name="cintura_id" id="cintura_id_select">
                <option value="">—</option>
                {% for peca in cinturas %}
                <option value="{{ peca.id }}">{{ peca.nome }}</option>
                {% endfor %}
            </select>
        </label>
        <div id="cintura-decoracoes-container"></div>

        <label>
            Pernas:
            <select name="pernas_id" id="pernas_id_select">
                <option value="">—</option>
                {% for peca in pernas %}
                <option value="{{ peca.id }}">{{ peca.nome }}</option>
                {% endfor %}
            </select>
        </label>
        <div id="pernas-decoracoes-container"></div>

        <label>
            Talismã:
            <select name="talisma_id">
                <option value="">—</option>
                {% for talisma in talismas %}
                <option value="{{ talisma.id }}">{{ talisma.nome }}</option>
                {% endfor %}
            </select>
        </label>

        <button type="submit">Montar Build</button>
    </form>

    <div id="build-resultado">
        {% include "_build_resumo.html" %}
    </div>


    <script>
        function selecionarArma(id, nome) {
            const input = document.getElementById('arma_id_input');
            input.value = id;
            document.getElementById('arma-selecionada-nome').textContent = nome;

            input.dispatchEvent(new Event('change', { bubbles: true }));

            htmx.ajax('GET', `/decoracoes-select/arma/${id}`, {
                target: '#arma-decoracoes-container',
                swap: 'innerHTML'
            });

            document.getElementById('modal-container').innerHTML = '';
        }

        const pecasArmadura = ['cabeca', 'peito', 'bracos', 'cintura', 'pernas'];

        pecasArmadura.forEach(campo => {
            const select = document.getElementById(`${campo}_id_select`);
            select.addEventListener('change', () => {
                const id = select.value;
                const container = document.getElementById(`${campo}-decoracoes-container`);

                if (!id) {
                    container.innerHTML = '';
                    return;
                }

                htmx.ajax('GET', `/decoracoes-select/${campo}/${id}`, {
                    target: `#${campo}-decoracoes-container`,
                    swap: 'innerHTML'
                });
            });
        });
    </script>
</body>
</html>
