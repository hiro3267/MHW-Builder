<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>{{ titulo }}</title>
    <script
     src="https://unpkg.com/htmx.org@2.0.3">
    </script>

    <script>
    function abrirModalArma() {
        htmx.ajax('GET', '/armas/modal', {
            target: '#modal-container',
            swap: 'innerHTML'
        });
    }


    function abrirModalArmadura(campo) {
        htmx.ajax('GET', `/armaduras/modal?campo=${encodeURIComponent(campo)}`, {
            target: '#modal-container',
            swap: 'innerHTML'
        });
    }

    function selecionarArma(id, nome) {
        const input = document.getElementById('arma_id_input');
        const nomeElemento = document.getElementById('arma-selecionada-nome');

        if (!input || !nomeElemento) {
            console.error('Não encontrei o campo ou o elemento do nome da arma.');
            return;
        }

        input.value = id;
        nomeElemento.textContent = nome;

        input.dispatchEvent(new Event('change', { bubbles: true }));

        document.getElementById('modal-container').innerHTML = '';
    }

    function selecionarArmadura(id, nome, campo) {
        const input = document.getElementById(`${campo}_id_select`);
        const nomeElemento = document.getElementById(
            `${campo}-selecionada-nome`
        );

        input.value = id;
        nomeElemento.textContent = nome;

        input.dispatchEvent(new Event('change', { bubbles: true }));

        htmx.ajax('GET', `/decoracoes-select/${campo}/${id}`, {
            target: `#${campo}-decoracoes-container`,
            swap: 'innerHTML'
        });

        document.getElementById('modal-container').innerHTML = '';
    }

    function abrirModalTalisma() {
        htmx.ajax('GET', '/talismas', {
            target: '#modal-container',
            swap: 'innerHTML'
        });
    }

    function selecionarTalisma(id, nome) {
        const input = document.getElementById('talisma_id_select');
        const nomeElemento = document.getElementById('talisma-selecionada-nome');

        if (!input || !nomeElemento) {
            console.error('Não encontrei o campo ou o nome do talismã.');
            return;
        }

        input.value = id;
        nomeElemento.textContent = nome;

        input.dispatchEvent(new Event('change', { bubbles: true }));

        document.getElementById('modal-container').innerHTML = '';
    }

    let tipoArmaSelecionado = null;

    function mostrarArmas(tipo) {
        tipoArmaSelecionado = tipo;

        document.getElementById('filtros-elementos').hidden = false;

        filtrarElemento('todos');
    }

    function filtrarElemento(elemento) {
        if (!tipoArmaSelecionado) return;

        const url = `/armas/modal/lista?tipo=${encodeURIComponent(tipoArmaSelecionado)}&elemento=${encodeURIComponent(elemento)}`;

        htmx.ajax('GET', url, {
            target: '#lista-armas-filtradas',
            swap: 'innerHTML'
        });
    }

</script>


    <style>
        body {
            background: #171a1f;
            color: #e4e8ef;
            font-family: Arial, sans-serif;
            margin: 20px;
        }

        .equipamentos {
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-width: 1000px;
        }

        .equipamento-linha {
            display: flex;
            align-items: center;
            gap: 16px;
            width: 100%;
            min-height: 82px;
            padding: 12px 18px;
            border: 1px solid transparent;
            border-radius: 10px;
            background: #20242b;
            color: #dce4f0;
            cursor: pointer;
            box-sizing: border-box;
            transition: background 0.15s, border-color 0.15s;
        }

        .equipamento-linha:hover {
            background: #292f38;
            border-color: #485363;
        }

        .equipamento-icone {
            width: 52px;
            height: 52px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
        }

        .equipamento-nome {
            flex: 1;
            text-align: center;
            font-size: 15px;
        }

        .equipamento-seta {
            color: #8995a5;
            font-size: 20px;
        }

        .modal-overlay {
            position: fixed;
            inset: 0;
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: rgb(0 0 0 / 70%);
        }

        .modal-box {
            width: min(700px, 100%);
            max-height: 85vh;
            overflow-y: auto;
            padding: 24px;
            border-radius: 12px;
            background: #20242b;
            color: #e4e8ef;
            box-sizing: border-box;
        }

        .modal-box input[type="text"] {
            width: 100%;
            padding: 12px;
            margin-bottom: 16px;
            border: 1px solid #485363;
            border-radius: 6px;
            background: #171a1f;
            color: white;
            box-sizing: border-box;
        }

        .modal-box li {
            padding: 12px;
            border-radius: 6px;
        }

        .modal-box li:hover {
            background: #343b46;
        }

        .modal-fechar {
            margin-top: 16px;
            padding: 10px 16px;
            cursor: pointer;
        }

        .modal-overlay {
            position: fixed;
            inset: 0;
            z-index: 1000;
            background: rgba(0, 0, 0, 0.75);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal-armaduras {
            width: 100%;
            max-width: 550px;
            max-height: 80vh;
            overflow-y: auto;
            background: #1e1e1e;
            color: #fff;
            border: 1px solid #555;
            border-radius: 10px;
            padding: 20px;
            box-sizing: border-box;
        }

        .modal-cabecalho {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 15px;
        }

        .modal-cabecalho h2 {
            margin: 0;
        }

        .modal-cabecalho button {
            cursor: pointer;
            font-size: 18px;
            color: white;
            background: transparent;
            border: none;
        }

        .lista-armaduras {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .lista-armaduras li {
            padding: 12px;
            border-bottom: 1px solid #444;
            cursor: pointer;
        }

        .lista-armaduras li:hover {
            background: #383838;
        }

        .caixas-tipos,
        .caixas-elementos {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 8px;
            margin: 12px 0 20px;
        }

        .caixa-filtro {
            padding: 12px 8px;
            border: 1px solid #555;
            border-radius: 8px;
            background: #2a2a2a;
            color: white;
            cursor: pointer;
        }

        .caixa-filtro:hover {
            background: #444;
            border-color: #aaa;
        }

        #filtros-elementos {
            margin-top: 20px;
        }

        #filtros-elementos[hidden] {
            display: none;
        }

        .slots-decoracoes {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin: -2px 0 10px;
            padding: 12px;
            border: 1px solid #343b46;
            border-radius: 0 0 10px 10px;
            background: #1b1f25;
        }

        .slot-decoracao {
            display: flex;
            flex: 1 1 200px;
            flex-direction: column;
            gap: 8px;
            min-width: 0;
        }

        .slot-decoracao label {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            font-size: 13px;
            color: #dce4f0;
        }

        .slot-nivel {
            padding: 3px 7px;
            border: 1px solid #485363;
            border-radius: 6px;
            color: #b9c9df;
            font-size: 12px;
        }

        .decoracao-select {
            width: 100%;
            padding: 10px;
            border: 1px solid #485363;
            border-radius: 7px;
            background: #20242b;
            color: #e4e8ef;
        }

        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.6);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-conteudo {
            background: white;
            color: black;
            padding: 20px;
            border-radius: 8px;
            width: 80%;
            max-width: 700px;
            max-height: 80vh;
            overflow-y: auto;
        }

        .modal-conteudo ul {
            list-style: none;
            padding: 0;
        }

        .modal-conteudo li {
            margin: 8px 0;
        }

        .modal-conteudo li button {
            width: 100%;
            padding: 10px;
            text-align: left;
            cursor: pointer;
        }

        .armadura-info {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 8px 12px;
            margin-bottom: 8px;
        }

        .armadura-raridade {
            color: #e8c56d;
            font-size: 13px;
        }

        .armadura-atributos {
            display: flex;
            flex-wrap: wrap;
            gap: 6px 12px;
            color: #c4cfdd;
            font-size: 13px;
            margin-bottom: 8px;
        }

        .armadura-skills,
        .armadura-slots {
            margin-top: 6px;
            font-size: 13px;
            color: #b9c9df;
        }

        .armadura-skills span {
            color: #e4e8ef;
        }

        .armadura-slots .slot-nivel {
            display: inline-block;
            margin: 3px;
        }
    </style>

</head>
<body>
    <h1>{{ titulo }}</h1>
    <p>Bem-vindo ao MHW Build Planner! Em breve você poderá criar e compartilhar suas builds de Monster Hunter World.</p>

    <button hx-get="ping" hx-target="#resultado">
        Testar HTMX
    </button>
    <div id="resultado"></div>

    <hr>

    <button hx-get="/armas" hx-target="#lista-armas">
        Listar Armas
    </button>
    <div id="lista-armas"></div>

    <hr>

    <button hx-get="/armaduras" hx-target="#lista-armaduras">
        Listar Armaduras
    </button>
    <div id="lista-armaduras"></div>

    <hr>

    <button hx-get="/decoracoes" hx-target="#lista-decoracoes">
        Listar Decorações
    </button>
    <div id="lista-decoracoes"></div>

    <button hx-get="/kinsects" hx-target="#lista-kinsects">
        Listar Kinsects (teste — depois vira condicional à Glaive de Insetos)
    </button>
    <div id="lista-kinsects"></div>

    <hr>

    <form
        id="build-form"
        hx-post="/build"
        hx-target="#build-resultado"
        hx-swap="innerHTML"
        hx-trigger="change delay:200ms"
    >
        <div class="equipamentos">

            <button type="button"
                    class="equipamento-linha"
                    onclick="abrirModalArma()">
                <span class="equipamento-icone">⚔</span>
                <span class="equipamento-nome" id="arma-selecionada-nome">
                    Selecione uma arma
                </span>
                <span class="equipamento-seta">›</span>
            </button>

            <input type="hidden" name="arma_id" id="arma_id_input">

            <button type="button"
                    class="equipamento-linha"
                    onclick="abrirModalArmadura('cabeca')">
                <span class="equipamento-icone">⛑</span>
                <span class="equipamento-nome" id="cabeca-selecionada-nome">
                    Selecione uma peça de armadura
                </span>
                <span class="equipamento-seta">›</span>
            </button>
            <input type="hidden" name="cabeca_id" id="cabeca_id_select">
            <div id="cabeca-decoracoes-container"></div>

            <button type="button"
                    class="equipamento-linha"
                    onclick="abrirModalArmadura('peito')">
                <span class="equipamento-icone">🛡</span>
                <span class="equipamento-nome" id="peito-selecionada-nome">
                    Selecione uma peça de armadura
                </span>
                <span class="equipamento-seta">›</span>
            </button>
            <input type="hidden" name="peito_id" id="peito_id_select">
            <div id="peito-decoracoes-container"></div>

            <button type="button"
                    class="equipamento-linha"
                    onclick="abrirModalArmadura('bracos')">
                <span class="equipamento-icone">🧤</span>
                <span class="equipamento-nome" id="bracos-selecionada-nome">
                    Selecione uma peça de armadura
                </span>
                <span class="equipamento-seta">›</span>
            </button>
            <input type="hidden" name="bracos_id" id="bracos_id_select">
            <div id="bracos-decoracoes-container"></div>

            <button type="button"
                    class="equipamento-linha"
                    onclick="abrirModalArmadura('cintura')">
                <span class="equipamento-icone">🥋</span>
                <span class="equipamento-nome" id="cintura-selecionada-nome">
                    Selecione uma peça de armadura
                </span>
                <span class="equipamento-seta">›</span>
            </button>
            <input type="hidden" name="cintura_id" id="cintura_id_select">
            <div id="cintura-decoracoes-container"></div>

            <button type="button"
                    class="equipamento-linha"
                    onclick="abrirModalArmadura('pernas')">
                <span class="equipamento-icone">🥾</span>
                <span class="equipamento-nome" id="pernas-selecionada-nome">
                    Selecione uma peça de armadura
                </span>
                <span class="equipamento-seta">›</span>
            </button>
            <input type="hidden" name="pernas_id" id="pernas_id_select">
            <div id="pernas-decoracoes-container"></div>

            <button type="button"
                    class="equipamento-linha"
                    onclick="abrirModalTalisma()">
                <span class="equipamento-icone">💎</span>
                <span class="equipamento-nome" id="talisma-selecionada-nome">
                    Selecione um talismã
                </span>
                <span class="equipamento-seta">›</span>
            </button>
            <input type="hidden" name="talisma_id" id="talisma_id_select">

            <div id="kinsect-container"></div>
            <div id="arma-decoracoes-container"></div>
        </div>
    </form>

    <div id="modal-container"></div>

    <div id="build-resultado">
        {% include "_build_resumo.html" %}
    </div>
    
</body>
</html>
