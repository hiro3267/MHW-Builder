
<div class="modal-overlay"
     onclick="if (event.target === this) this.remove()">

    <div class="modal-box">

        <div class="modal-cabecalho">
            <h2>Selecionar Talismã</h2>

            <button type="button"
                    onclick="this.closest('.modal-overlay').remove()">
                ✕
            </button>
        </div>

        <div class="filtros-equipamento">

            <input
                type="text"
                id="busca-talisma"
                placeholder="Pesquisar talismã..."
                oninput="filtrarTalismasModal()"
            >

            <input
                type="text"
                id="busca-skill-talisma"
                placeholder="Pesquisar habilidade..."
                oninput="filtrarTalismasModal()"
            >

            <select
                id="filtro-raridade-talisma"
                onchange="filtrarTalismasModal()"
            >
                <option value="todos">Todas as raridades</option>
            </select>

            <select
                id="filtro-nivel-talisma"
                onchange="filtrarTalismasModal()"
            >
                <option value="todos">Todos os níveis</option>
            </select>

            <select
                id="ordem-talisma"
                onchange="ordenarTalismasModal()"
            >
                <option value="nome">Nome (A-Z)</option>
                <option value="raridade-desc">Maior raridade</option>
                <option value="raridade-asc">Menor raridade</option>
                <option value="nivel-desc">Maior nível</option>
                <option value="nivel-asc">Menor nível</option>
            </select>

        </div>

        <ul class="lista-armaduras" id="lista-talismas-modal">

            {% for talisma in talismas %}
                <li
                    data-id="{{ talisma.id }}"
                    data-nome="{{ talisma.nome | lower }}"
                    data-raridade="{{ talisma.raridade }}"
                    data-nivel="{{ talisma.nivel }}"
                    data-skills="{{ talisma.skills | map(attribute='nome') | join('|') | lower }}"
                >
                    <button
                        type="button"
                        onclick="selecionarTalisma(
                            '{{ talisma.id }}',
                            this.dataset.nome
                        )"
                        data-nome="{{ talisma.nome }}"
                        style="width: 100%;
                               background: transparent;
                               color: inherit;
                               border: none;
                               text-align: left;
                               cursor: pointer;"
                    >
                        <strong>{{ talisma.nome }}</strong>
                        (raridade {{ talisma.raridade }})

                        {% if talisma.skills %}
                            — Skills:
                            {% for skill in talisma.skills %}
                                {{ skill.nome }} {{ skill.nivel }}{% if not loop.last %}, {% endif %}
                            {% endfor %}
                        {% endif %}
                    </button>
                </li>

            {% else %}
                <li>Nenhum talismã cadastrado ainda.</li>
            {% endfor %}

        </ul>

    </div>
</div>
